name: Offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Reject tracked files covered by ignore rules
        run: |
          tracked_ignored="$(git ls-files --cached --ignored --exclude-standard)"
          if [[ -n "$tracked_ignored" ]]; then
            printf 'Tracked files match repository ignore rules:\n%s\n' "$tracked_ignored" >&2
            exit 1
          fi
      - name: Build and test the public source
        run: bash scripts/verify-source.sh
      - name: Validate the unsigned app bundle build
        run: bash script/build_and_run.sh --build-only
