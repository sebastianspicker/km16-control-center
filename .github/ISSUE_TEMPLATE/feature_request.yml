name: Feature request
description: Propose a focused improvement to the public source project.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: Describe the public behavior and its use case. Do not attach raw firmware, device captures, credentials, signing files, or private logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain who needs the change and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the observable result and a short example when useful.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Acceptance checks
      description: List the tests or manual steps that would show the feature works.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request contains no raw firmware, device captures, credentials, signing files, or private logs.
          required: true
